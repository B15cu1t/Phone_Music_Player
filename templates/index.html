<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<title>Biscuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;
  --surface:#141414;
  --card:#1a1a1a;
  --border:#2a2a2a;
  --orange:#f5820d;
  --orange-dim:#b85e08;
  --orange-glow:rgba(245,130,13,0.12);
  --text:#f0ece4;
  --muted:#5a5650;
  --muted2:#3a3834;
  --r:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Familjen Grotesk',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 12px) 18px calc(var(--safe-bot) + 10px);gap:14px;max-width:460px;margin:0 auto}

/* views */
.view{display:none;flex-direction:column;flex:1;gap:14px;overflow:hidden}
.view.active{display:flex}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Space Mono',monospace;font-weight:700;font-size:19px;letter-spacing:-0.5px;color:var(--text)}
.logo em{color:var(--orange);font-style:normal}
.topbar-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:border-color .15s,color .15s;flex-shrink:0;line-height:1}
.icon-btn:active{background:var(--border)}
.icon-btn.lit{border-color:var(--orange);color:var(--orange)}

/* artwork */
.artwork-wrap{flex-shrink:0;position:relative;width:100%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.artwork-wrap img{width:100%;height:100%;object-fit:cover;display:none}
.artwork-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:72px}
.art-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,.6) 0%,transparent 50%);pointer-events:none}

/* track info */
.track-info{flex-shrink:0}
.track-title{font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(17px,5vw,24px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:13px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Space Mono',monospace}

/* progress */
.progress-row{flex-shrink:0;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 1s linear;width:0%}
.time{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);width:34px;flex-shrink:0}
.time.right{text-align:right}

/* controls */
.controls{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctrl{border:none;background:var(--card);color:var(--muted);border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:color .15s,background .15s,transform .1s;flex:1;aspect-ratio:1;border:1px solid var(--border)}
.ctrl:active{transform:scale(.92);background:var(--border)}
.ctrl.on{color:var(--orange);border-color:var(--orange-dim)}
.ctrl.primary{background:var(--orange);color:#0d0d0d;font-size:24px;border-color:var(--orange);flex:1.4}
.ctrl.primary:active{background:var(--orange-dim)}


/* nav */
.bottom-nav{flex-shrink:0;display:flex;background:var(--card);border-radius:14px;padding:5px;gap:3px;border:1px solid var(--border)}
.nav-btn{flex:1;padding:11px 0;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:10px;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;line-height:1}
.nav-btn.active{background:var(--border);color:var(--orange)}

/* queue */
.section-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.section-title{font-family:'Space Mono',monospace;font-weight:700;font-size:15px}
.badge{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.list::-webkit-scrollbar{width:2px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.track-row{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);border-radius:12px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.track-row:active{background:var(--border)}
.track-row.now{border-color:var(--orange)}
.row-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--surface);flex-shrink:0}
.row-thumb-ph{width:42px;height:42px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.row-meta{flex:1;min-width:0}
.row-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-artist{font-size:11px;color:var(--muted);margin-top:3px;font-family:'Space Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0;animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* search */
.search-wrap{flex-shrink:0;position:relative}
.search-field{width:100%;padding:14px 14px 14px 44px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Familjen Grotesk',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.search-field:focus{border-color:var(--orange)}
.search-field::placeholder{color:var(--muted)}
.search-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none;line-height:1}
.hint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;font-family:'Space Mono',monospace}
.hint-ico{font-size:44px}
.play-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--orange);color:#0d0d0d;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}

/* error */
#err{display:none;flex-shrink:0;background:rgba(200,60,30,.12);border:1px solid rgba(200,60,30,.4);border-radius:10px;padding:9px 13px;font-size:12px;color:#e87060;font-family:'Space Mono',monospace}

/* status */
#pill{position:fixed;top:calc(var(--safe-top) + 10px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:6px 16px;font-size:12px;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .25s;z-index:99;white-space:nowrap;font-family:'Space Mono',monospace}
#pill.show{opacity:1}

/* loading shimmer */
.shim{background:linear-gradient(90deg,var(--surface) 25%,var(--border) 50%,var(--surface) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:6px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* entrance */
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.track-title,.track-artist{animation:up .25s ease}

/* queue building state */
.empty-state{color:var(--muted);font-size:13px;padding:24px 0;text-align:center;font-family:'Space Mono',monospace}
</style>
</head>
<body>
<div id="app">

<div id="pill"></div>

<!-- PLAYER -->
<div class="view active" id="view-player">
  <div class="topbar">
    <div class="logo">&#x25CF; <em>biscuit</em></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-refresh" title="Refresh queue">&#x21BB;</button>
      <button class="icon-btn" id="btn-acct" title="Account">&#x1F464;</button>
    </div>
  </div>

  <div id="err"></div>

  <div class="artwork-wrap" id="art-wrap">
    <div class="artwork-placeholder" id="art-ph">&#x1F36A;</div>
    <img id="art-img" alt="">
    <div class="art-overlay"></div>
  </div>

  <div class="track-info">
    <div class="track-title" id="t-title">warming up...</div>
    <div class="track-artist" id="t-artist">building your queue</div>
  </div>

  <div class="progress-row">
    <span class="time" id="t-cur">0:00</span>
    <div class="prog-bar" id="prog-bar">
      <div class="prog-fill" id="prog-fill"></div>
    </div>
    <span class="time right" id="t-tot">-:--</span>
  </div>

  <div class="controls">
    <button class="ctrl" id="btn-shuf" title="Shuffle">&#x21C4;</button>
    <button class="ctrl" id="btn-prev" title="Prev">&#x23EE;</button>
    <button class="ctrl primary" id="btn-pp" title="Play/pause">&#x25B6;</button>
    <button class="ctrl" id="btn-next" title="Next">&#x23ED;</button>
    <button class="ctrl" id="btn-rep" title="Repeat">&#x21BA;</button>
  </div>

</div>

<!-- QUEUE -->
<div class="view" id="view-queue">
  <div class="topbar">
    <div class="logo">&#x25CF; <em>queue</em></div>
    <button class="icon-btn" id="btn-ref-q" title="Refresh">&#x21BB;</button>
  </div>
  <div class="section-header">
    <span class="section-title">up next</span>
    <span class="badge" id="q-count"></span>
  </div>
  <div class="list" id="q-list">
    <div class="empty-state">loading...</div>
  </div>
</div>

<!-- SEARCH -->
<div class="view" id="view-search">
  <div class="topbar">
    <div class="logo">&#x25CF; <em>find</em></div>
  </div>
  <div class="search-wrap">
    <span class="search-ico">&#x1F50D;</span>
    <input class="search-field" id="s-input" type="search" placeholder="artist, song, vibe..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="list" id="s-list">
    <div class="hint">
      <div class="hint-ico">&#x1F3B8;</div>
      <div>search youtube music</div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="player" title="Player">&#x25B6;</button>
  <button class="nav-btn" data-view="queue" title="Queue">&#x2630;</button>
  <button class="nav-btn" data-view="search" title="Search">&#x2295;</button>
</nav>

</div>

<script>
var cur={},pillT=null,searchT=null;

var $=function(id){return document.getElementById(id)};

// nav
document.querySelectorAll('.nav-btn').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.dataset.view;
    document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    document.getElementById('view-'+v).classList.add('active');
    if(v==='queue') renderQueue(cur);
  });
});

// api
async function api(path,method,body){
  var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  try{var r=await fetch('/api/'+path,opts);return await r.json();}catch(e){return null;}
}

// poll
async function poll(){
  var d=await api('state');
  if(!d) return;
  cur=d;
  updateUI(d);
}

function updateUI(d){
  var c=d.current;

  // error
  var err=$('err');
  if(d.error){err.style.display='block';err.textContent='! '+d.error;}
  else{err.style.display='none';}

  // track
  if(c){
    var newTitle=c.title||'Unknown';
    if($('t-title').textContent!==newTitle){
      $('t-title').textContent=newTitle;
      $('t-artist').textContent=c.artist||'';
      if(c.thumbnail){
        $('art-img').src=c.thumbnail;
        $('art-img').style.display='block';
        $('art-ph').style.display='none';
      } else {
        $('art-img').style.display='none';
        $('art-ph').style.display='flex';
      }
    }
    var dur=c.duration||0,prog=d.progress||0;
    var pct=dur>0?Math.min(100,(prog/dur)*100):0;
    $('prog-fill').style.width=pct+'%';
    $('t-cur').textContent=fmt(prog);
    $('t-tot').textContent=dur>0?fmt(dur):'-:--';
  }

  // play/pause
  $('btn-pp').innerHTML=d.playing?'&#x23F8;':'&#x25B6;';

  // toggles
  $('btn-shuf').classList.toggle('on',!!d.shuffle);
  $('btn-rep').classList.toggle('on',!!d.repeat);

  // account
  $('btn-acct').textContent=d.ytm_auth?'\u2713':'\uD83D\uDC64';
  $('btn-acct').title=d.ytm_auth?'Signed in to YouTube Music':'No account (unauthenticated)';
  $('btn-acct').classList.toggle('lit',!!d.ytm_auth);
}

// controls
$('btn-pp').addEventListener('click',async function(){
  if(cur.playing) await api('pause','POST');
  else { await api('resume','POST'); if(!cur.current) await api('play','POST',{}); }
  poll();
});
$('btn-next').addEventListener('click',async function(){ pill('next \u2192'); await api('next','POST'); poll(); });
$('btn-prev').addEventListener('click',async function(){ await api('prev','POST'); poll(); });
$('btn-shuf').addEventListener('click',async function(){
  var r=await api('toggle/shuffle','POST');
  if(r) pill(r.shuffle?'shuffle on':'shuffle off');
  poll();
});
$('btn-rep').addEventListener('click',async function(){
  var r=await api('toggle/repeat','POST');
  if(r) pill(r.repeat?'repeat on':'repeat off');
  poll();
});
$('btn-refresh').addEventListener('click',async function(){ pill('refreshing queue...'); await api('queue/refresh','POST'); });
$('btn-ref-q').addEventListener('click',async function(){ pill('refreshing...'); await api('queue/refresh','POST'); });

// queue render
function renderQueue(d){
  var q=d.queue||[], c=d.current;
  $('q-count').textContent=q.length?q.length+' tracks':'';
  if(!q.length){
    $('q-list').innerHTML='<div class="empty-state">queue empty \u2014 tap \u21BB to refresh</div>';
    return;
  }
  $('q-list').innerHTML=q.map(function(t){
    var isNow=c&&t.video_id===c.video_id;
    var thumb=t.thumbnail
      ?'<img class="row-thumb" src="'+esc(t.thumbnail)+'" alt="" loading="lazy">'
      :'<div class="row-thumb-ph">\uD83C\uDFB5</div>';
    return '<div class="track-row'+(isNow?' now':'')+'" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+'" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">'+thumb+'<div class="row-meta"><div class="row-title">'+esc(t.title)+'</div><div class="row-artist">'+esc(t.artist)+'</div></div>'+(isNow?'<div class="now-dot"></div>':'')+'</div>';
  }).join('');
  $('q-list').querySelectorAll('.track-row').forEach(function(el){
    el.addEventListener('click',async function(){
      pill('loading...');
      await api('play','POST',{video_id:el.dataset.id,title:el.dataset.title,artist:el.dataset.artist,thumbnail:el.dataset.thumb});
      document.querySelector('[data-view="player"]').click();
      poll();
    });
  });
}

// search
$('s-input').addEventListener('input',function(){
  clearTimeout(searchT);
  var q=$('s-input').value.trim();
  if(!q){$('s-list').innerHTML='<div class="hint"><div class="hint-ico">\uD83C\uDFB8</div><div>search youtube music</div></div>';return;}
  $('s-list').innerHTML='<div class="hint"><div class="hint-ico">\u23F3</div><div>searching...</div></div>';
  searchT=setTimeout(function(){doSearch(q);},600);
});

async function doSearch(q){
  var d=await api('search?q='+encodeURIComponent(q));
  if(!d||!d.results.length){
    $('s-list').innerHTML='<div class="hint"><div class="hint-ico">\uD83E\uDD14</div><div>nothing found</div></div>';
    return;
  }
  $('s-list').innerHTML=d.results.map(function(t){
    var thumb=t.thumbnail
      ?'<img class="row-thumb" src="'+esc(t.thumbnail)+'" alt="" loading="lazy">'
      :'<div class="row-thumb-ph">\uD83C\uDFB5</div>';
    return '<div class="track-row" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+'" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">'+thumb+'<div class="row-meta"><div class="row-title">'+esc(t.title)+'</div><div class="row-artist">'+esc(t.artist)+'</div></div><button class="play-btn" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+'" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">&#x25B6;</button></div>';
  }).join('');
  $('s-list').querySelectorAll('.play-btn').forEach(function(btn){
    btn.addEventListener('click',async function(e){
      e.stopPropagation();
      pill('loading...');
      await api('play','POST',{video_id:btn.dataset.id,title:btn.dataset.title,artist:btn.dataset.artist,thumbnail:btn.dataset.thumb});
      document.querySelector('[data-view="player"]').click();
      poll();
    });
  });
}

// helpers
function fmt(s){
  if(!s||s<0) return '0:00';
  var m=Math.floor(s/60),sec=String(Math.floor(s%60)).padStart(2,'0');
  return m+':'+sec;
}
function esc(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pill(msg){
  var p=$('pill');
  p.textContent=msg;
  p.classList.add('show');
  clearTimeout(pillT);
  pillT=setTimeout(function(){p.classList.remove('show');},2000);
}

// wake lock
async function wakeLock(){
  try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch(e){}
}
wakeLock();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') wakeLock();});

// start
setInterval(poll,1500);
poll();
</script>
</body>
</html>
