<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<title>Biscuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:#252525;
  --orange:#f5820d;--orange-dim:#b85e08;--orange-glow:rgba(245,130,13,0.08);
  --text:#f0ece4;--muted:#555050;--r:16px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Familjen Grotesk',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;
  padding:calc(var(--safe-top) + 12px) 18px calc(var(--safe-bot) + 10px);
  gap:12px;max-width:460px;margin:0 auto}

/* views */
.view{display:none;flex-direction:column;flex:1;gap:12px;overflow:hidden;min-height:0}
.view.active{display:flex}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;color:var(--text)}
.logo em{color:var(--orange);font-style:normal}
.topbar-r{display:flex;gap:7px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:15px;transition:border-color .15s,color .15s;flex-shrink:0}
.icon-btn:active{background:var(--border)}
.icon-btn.lit{border-color:var(--orange);color:var(--orange)}

/* artwork */
.art-wrap{flex-shrink:0;width:100%;aspect-ratio:1;border-radius:var(--r);
  overflow:hidden;background:var(--surface);border:1px solid var(--border);position:relative}
.art-wrap img{width:100%;height:100%;object-fit:cover;display:none}
.art-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:68px}
.art-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,.55) 0%,transparent 50%);pointer-events:none}

/* loading bar */
.loading-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--border)}
.loading-fill{height:100%;width:0%;background:var(--orange);animation:loadpulse 1.5s ease-in-out infinite}
@keyframes loadpulse{0%{width:0%;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}

/* track info + dislike */
.track-row-info{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.track-meta{flex:1;min-width:0}
.track-title{font-family:'Space Mono',monospace;font-weight:700;
  font-size:clamp(16px,5vw,22px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Space Mono',monospace}
.dislike-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:transparent;color:var(--muted);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:color .15s,border-color .15s;margin-top:2px}
.dislike-btn:active{color:#e05050;border-color:#e05050}

/* progress */
.prog-row{flex-shrink:0;display:flex;align-items:center;gap:9px}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 1s linear;width:0%}
.time{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);width:32px;flex-shrink:0}
.time.r{text-align:right}

/* controls */
.controls{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctrl{border:none;background:var(--card);color:var(--muted);border-radius:13px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex:1;aspect-ratio:1;border:1px solid var(--border);
  transition:color .15s,background .15s,transform .1s;line-height:1}
.ctrl:active{transform:scale(.91);background:var(--border)}
.ctrl.on{color:var(--orange);border-color:var(--orange-dim)}
.ctrl.primary{background:var(--orange);color:#0d0d0d;font-size:22px;
  border-color:var(--orange);flex:1.5;border-radius:14px}
.ctrl.primary:active{background:var(--orange-dim)}

/* bottom nav */
.bottom-nav{flex-shrink:0;display:flex;background:var(--card);border-radius:13px;
  padding:4px;gap:3px;border:1px solid var(--border)}
.nav-btn{flex:1;padding:10px 0;border:none;background:transparent;color:var(--muted);
  font-size:17px;cursor:pointer;border-radius:9px;
  transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;line-height:1}
.nav-btn.active{background:var(--border);color:var(--orange)}

/* error banner */
#err{display:none;flex-shrink:0;background:rgba(200,60,30,.1);
  border:1px solid rgba(200,60,30,.35);border-radius:10px;
  padding:8px 12px;font-size:12px;color:#e07060;font-family:'Space Mono',monospace}

/* status pill */
#pill{position:fixed;top:calc(var(--safe-top)+8px);left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);border-radius:99px;
  padding:5px 14px;font-size:11px;color:var(--muted);pointer-events:none;
  opacity:0;transition:opacity .2s;z-index:99;white-space:nowrap;font-family:'Space Mono',monospace}
#pill.show{opacity:1}

/* queue / search lists */
.section-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.section-title{font-family:'Space Mono',monospace;font-weight:700;font-size:14px}
.badge{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;min-height:0}
.list::-webkit-scrollbar{width:2px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}

/* track row */
.track-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--card);border-radius:11px;cursor:pointer;
  border:1px solid transparent;transition:border-color .15s;position:relative}
.track-row:active{background:var(--border)}
.track-row.now{border-color:var(--orange)}
.row-thumb{width:40px;height:40px;border-radius:7px;object-fit:cover;
  background:var(--surface);flex-shrink:0}
.row-thumb-ph{width:40px;height:40px;border-radius:7px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;border:1px solid var(--border)}
.row-meta{flex:1;min-width:0}
.row-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-artist{font-size:11px;color:var(--muted);margin-top:2px;
  font-family:'Space Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:4px;flex-shrink:0}
.row-btn{width:30px;height:30px;border-radius:50%;border:none;
  background:transparent;color:var(--muted);display:flex;align-items:center;
  justify-content:center;font-size:14px;cursor:pointer;transition:color .15s}
.row-btn.play{background:var(--orange);color:#0d0d0d;font-size:13px}
.row-btn.play:active{background:var(--orange-dim)}
.row-btn.del:active{color:#e05050}
.now-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);
  flex-shrink:0;animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* search */
.search-wrap{flex-shrink:0;position:relative}
.search-field{width:100%;padding:13px 13px 13px 42px;background:var(--card);
  border:1px solid var(--border);border-radius:11px;color:var(--text);
  font-family:'Familjen Grotesk',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.search-field:focus{border-color:var(--orange)}
.search-field::placeholder{color:var(--muted)}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;line-height:1}

/* hint / empty */
.hint{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--muted);font-size:12px;
  font-family:'Space Mono',monospace;text-align:center;padding:20px}
.hint-ico{font-size:40px}

/* taste chips */
.taste-row{flex-shrink:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.taste-row::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;background:var(--card);border:1px solid var(--border);
  border-radius:99px;font-size:11px;color:var(--muted);white-space:nowrap;
  cursor:pointer;font-family:'Space Mono',monospace;transition:border-color .15s,color .15s}
.chip:active{border-color:var(--orange);color:var(--orange)}

/* drag handle */
.drag-handle{width:28px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:grab;flex-shrink:0;font-size:13px;opacity:.5;touch-action:none}
.drag-handle:active{cursor:grabbing}
.track-row.dragging{opacity:.35;border:1px dashed var(--orange);background:var(--surface)}
.track-row.drag-over{border-color:var(--orange);border-style:solid;
  box-shadow:0 0 0 1px var(--orange-dim)}
.track-row.drag-over-above::before{content:'';display:block;position:absolute;
  top:-3px;left:12px;right:12px;height:2px;background:var(--orange);border-radius:1px}
.track-row.drag-over-below::after{content:'';display:block;position:absolute;
  bottom:-3px;left:12px;right:12px;height:2px;background:var(--orange);border-radius:1px}

/* vibe input in queue tab */
.vibe-wrap{flex-shrink:0;position:relative}
.vibe-field{width:100%;padding:12px 12px 12px 40px;background:var(--card);
  border:1px solid var(--border);border-radius:11px;color:var(--text);
  font-family:'Familjen Grotesk',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.vibe-field:focus{border-color:var(--orange)}
.vibe-field::placeholder{color:var(--muted)}
.vibe-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;pointer-events:none;line-height:1}

@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.track-title,.track-artist{animation:up .2s ease}
</style>
</head>
<body>
<div id="app">
<div id="pill"></div>

<!-- ── PLAYER ── -->
<div class="view active" id="view-player">
  <div class="topbar">
    <div class="logo">&#x25CF;&nbsp;<em>biscuit</em></div>
    <div class="topbar-r">
      <button class="icon-btn" id="btn-refresh" title="Refresh queue">&#x21BB;</button>
      <button class="icon-btn" id="btn-acct" title="Account">&#x1F464;</button>
    </div>
  </div>

  <div id="err"></div>

  <div class="art-wrap" id="art-wrap">
    <div class="art-ph" id="art-ph">&#x1F36A;</div>
    <img id="art-img" alt="">
    <div class="art-overlay"></div>
    <div class="loading-bar" id="loading-bar" style="display:none">
      <div class="loading-fill"></div>
    </div>
  </div>

  <div class="track-row-info">
    <div class="track-meta">
      <div class="track-title" id="t-title">ready</div>
      <div class="track-artist" id="t-artist">search a song to start</div>
    </div>
    <button class="dislike-btn" id="btn-dislike" title="Never play this again">&#x1F6AB;</button>
  </div>

  <div class="prog-row">
    <span class="time" id="t-cur">0:00</span>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    <span class="time r" id="t-tot">-:--</span>
  </div>

  <div class="controls">
    <button class="ctrl" id="btn-shuf" title="Shuffle">&#x21C4;</button>
    <button class="ctrl" id="btn-prev" title="Prev">&#x23EE;</button>
    <button class="ctrl primary" id="btn-pp" title="Play/Pause">&#x25B6;</button>
    <button class="ctrl" id="btn-next" title="Next">&#x23ED;</button>
    <button class="ctrl" id="btn-rep" title="Repeat">&#x21BA;</button>
  </div>
</div>

<!-- ── QUEUE ── -->
<div class="view" id="view-queue">
  <div class="topbar">
    <div class="logo">&#x25CF;&nbsp;<em>queue</em></div>
    <button class="icon-btn" id="btn-ref-q">&#x21BB;</button>
  </div>

  <div class="vibe-wrap">
    <span class="vibe-ico">&#x2665;</span>
    <input class="vibe-field" id="vibe-input" type="search"
      placeholder="seed a vibe... metal, sad rap, 2000s rock"
      autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="taste-row" id="taste-row"></div>

  <div class="section-header">
    <span class="section-title">up next</span>
    <span class="badge" id="q-count"></span>
  </div>
  <div class="list" id="q-list">
    <div class="hint"><div class="hint-ico">&#x1F3B5;</div><div>play a song to build the queue</div></div>
  </div>
</div>

<!-- ── SEARCH ── -->
<div class="view" id="view-search">
  <div class="topbar">
    <div class="logo">&#x25CF;&nbsp;<em>find</em></div>
  </div>
  <div class="search-wrap">
    <span class="search-ico">&#x1F50D;</span>
    <input class="search-field" id="s-input" type="search"
      placeholder="artist, song, anything..."
      autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="list" id="s-list">
    <div class="hint"><div class="hint-ico">&#x1F3B8;</div><div>search youtube music</div></div>
  </div>
</div>

<!-- ── NAV ── -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="player">&#x25B6;</button>
  <button class="nav-btn" data-view="queue">&#x2630;</button>
  <button class="nav-btn" data-view="search">&#x2295;</button>
</nav>
</div>

<script>
var S={},pillT=null,searchT=null,vibeT=null;
var $=function(id){return document.getElementById(id)};

// ── nav ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.dataset.view;
    document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    document.getElementById('view-'+v).classList.add('active');
    if(v==='queue') renderQueue(S);
  });
});

// ── api ───────────────────────────────────────────────────────────────────
async function api(path,method,body){
  var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  try{var r=await fetch('/api/'+path,opts);return await r.json();}
  catch(e){return null;}
}

// ── poll ──────────────────────────────────────────────────────────────────
async function poll(){
  var d=await api('state');
  if(!d) return;
  S=d;
  updateUI(d);
  if(document.getElementById('view-queue').classList.contains('active') && !dragActive){
    renderQueue(d);
  }
}

function updateUI(d){
  var c=d.current;

  // error
  var err=$('err');
  if(d.error){err.style.display='block';err.textContent='! '+d.error;}
  else{err.style.display='none';}

  // loading bar
  $('loading-bar').style.display=d.loading?'block':'none';

  // track
  if(c){
    var nt=c.title||'Unknown';
    if($('t-title').textContent!==nt){
      $('t-title').textContent=nt;
      $('t-artist').textContent=c.artist||'';
      if(c.thumbnail){
        $('art-img').src=c.thumbnail;
        $('art-img').style.display='block';
        $('art-ph').style.display='none';
      } else {
        $('art-img').style.display='none';
        $('art-ph').style.display='flex';
      }
    }
    var dur=c.duration||0,prog=d.progress||0;
    $('prog-fill').style.width=(dur>0?Math.min(100,(prog/dur)*100):0)+'%';
    $('t-cur').textContent=fmt(prog);
    $('t-tot').textContent=dur>0?fmt(dur):'-:--';
    $('btn-dislike').dataset.id=c.video_id||'';
  }

  // play/pause icon
  $('btn-pp').innerHTML=d.playing?'&#x23F8;':'&#x25B6;';

  // toggles
  $('btn-shuf').classList.toggle('on',!!d.shuffle);
  $('btn-rep').classList.toggle('on',!!d.repeat);

  // account badge
  $('btn-acct').textContent=d.ytm_auth?'\u2713':'\uD83D\uDC64';
  $('btn-acct').classList.toggle('lit',!!d.ytm_auth);

  // taste chips (only update when we get new ones)
  if(d.top_artists && d.top_artists.length){
    renderTasteChips(d.top_artists);
  }
}

// ── controls ──────────────────────────────────────────────────────────────
$('btn-pp').addEventListener('click',async function(){
  if(S.playing) await api('pause','POST');
  else { await api('resume','POST'); if(!S.current) await api('play','POST',{}); }
  poll();
});
$('btn-next').addEventListener('click',async function(){
  pill('next \u2192');
  await api('next','POST');
  poll();
});
$('btn-prev').addEventListener('click',async function(){
  await api('prev','POST'); poll();
});
$('btn-shuf').addEventListener('click',async function(){
  var r=await api('toggle/shuffle','POST');
  if(r) pill(r.shuffle?'shuffle on':'shuffle off');
  poll();
});
$('btn-rep').addEventListener('click',async function(){
  var r=await api('toggle/repeat','POST');
  if(r) pill(r.repeat?'repeat on':'repeat off');
  poll();
});
$('btn-refresh').addEventListener('click',async function(){
  pill('refreshing queue...');
  await api('queue/refresh','POST');
});
$('btn-ref-q').addEventListener('click',async function(){
  pill('refreshing...');
  await api('queue/refresh','POST');
});
$('btn-dislike').addEventListener('click',async function(){
  var id=this.dataset.id;
  if(!id) return;
  pill('\uD83D\uDEAB never again');
  await api('dislike','POST',{video_id:id});
  poll();
});
$('btn-acct').addEventListener('click',function(){
  pill(S.ytm_auth?'signed in to youtube music':'no account \u2014 using search mode');
});

// ── taste chips ───────────────────────────────────────────────────────────
var lastChips=[];
function renderTasteChips(artists){
  if(JSON.stringify(artists)===JSON.stringify(lastChips)) return;
  lastChips=artists;
  var row=$('taste-row');
  row.innerHTML=artists.map(function(a){
    return '<div class="chip" data-artist="'+esc(a)+'">'+esc(a)+'</div>';
  }).join('');
  row.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',async function(){
      var a=c.dataset.artist;
      pill('seeding: '+a+'...');
      await api('queue/seed','POST',{vibe:a});
      document.querySelector('[data-view="player"]').click();
      poll();
    });
  });
}

// ── queue + drag to reorder ───────────────────────────────────────────────
var dragSrcId = null;
var dragActive = false;

function renderQueue(d){
  var q=d.queue||[];
  $('q-count').textContent=q.length?q.length+' up next':'';

  if(!q.length){
    $('q-list').innerHTML='<div class="hint"><div class="hint-ico">\uD83C\uDFB5</div><div>play a song to build the queue</div></div>';
    return;
  }

  $('q-list').innerHTML=q.map(function(t){
    var thumb=t.thumbnail
      ?'<img class="row-thumb" src="'+esc(t.thumbnail)+'" alt="" loading="lazy">'
      :'<div class="row-thumb-ph">\uD83C\uDFB5</div>';
    return '<div class="track-row" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+
      '" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">'+
      '<div class="drag-handle" data-handle="1">\u2630</div>'+
      thumb+
      '<div class="row-meta"><div class="row-title">'+esc(t.title)+'</div>'+
      '<div class="row-artist">'+esc(t.artist)+'</div></div>'+
      '<div class="row-actions">'+
      '<button class="row-btn del" data-id="'+esc(t.video_id)+'" title="Remove">\u2715</button>'+
      '</div></div>';
  }).join('');

  // tap to play
  $('q-list').querySelectorAll('.track-row').forEach(function(el){
    el.addEventListener('click',async function(e){
      if(dragActive) return;
      if(e.target.closest('.row-btn')||e.target.closest('.drag-handle')) return;
      pill('loading...');
      await api('play','POST',{video_id:el.dataset.id,title:el.dataset.title,
        artist:el.dataset.artist,thumbnail:el.dataset.thumb});
      document.querySelector('[data-view="player"]').click();
      poll();
    });
  });

  // remove button
  $('q-list').querySelectorAll('.row-btn.del').forEach(function(btn){
    btn.addEventListener('click',async function(e){
      e.stopPropagation();
      await api('queue/remove','POST',{video_id:btn.dataset.id});
      poll();
      renderQueue(S);
    });
  });

  // attach drag
  attachDrag($('q-list'));
}

function attachDrag(list){
  var rows = Array.from(list.querySelectorAll('.track-row'));
  rows.forEach(function(row){
    var handle = row.querySelector('.drag-handle');
    if(!handle) return;

    // ── touch drag ──────────────────────────────────────────────────────
    handle.addEventListener('touchstart', function(e){
      e.stopPropagation();
      dragActive = false;
      dragSrcId  = row.dataset.id;
      var startY = e.touches[0].clientY;
      var moved  = false;

      // ghost clone that follows the finger
      var ghost = row.cloneNode(true);
      ghost.style.cssText = 'position:fixed;left:18px;right:18px;z-index:999;opacity:.85;'+
        'pointer-events:none;border-radius:11px;background:#1e1e1e;border:1px solid var(--orange);'+
        'box-shadow:0 8px 24px rgba(0,0,0,.6);transition:none';
      ghost.style.top = row.getBoundingClientRect().top+'px';
      document.body.appendChild(ghost);

      function onMove(e2){
        var y  = e2.touches[0].clientY;
        var dy = y - startY;
        if(Math.abs(dy) > 4) { moved=true; dragActive=true; }
        if(!moved) return;
        e2.preventDefault();
        ghost.style.top = (row.getBoundingClientRect().top + dy) + 'px';
        row.classList.add('dragging');

        // find which row we're hovering over
        list.querySelectorAll('.track-row').forEach(function(r){
          r.classList.remove('drag-over-above','drag-over-below');
        });
        var target = getRowAtY(list, y);
        if(target && target !== row){
          var rect   = target.getBoundingClientRect();
          var midY   = rect.top + rect.height/2;
          target.classList.add(y < midY ? 'drag-over-above' : 'drag-over-below');
        }
      }

      function onEnd(e2){
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend',  onEnd);
        ghost.remove();
        row.classList.remove('dragging');
        list.querySelectorAll('.track-row').forEach(function(r){
          r.classList.remove('drag-over-above','drag-over-below');
        });

        if(!moved){ dragActive=false; dragSrcId=null; return; }

        var y      = e2.changedTouches[0].clientY;
        var target = getRowAtY(list, y);
        if(target && target !== row && target.dataset.id){
          var toId = target.dataset.id;
          api('queue/reorder','POST',{from_id: dragSrcId, to_id: toId})
            .then(function(){ poll(); renderQueue(S); });
        }
        setTimeout(function(){ dragActive=false; dragSrcId=null; }, 50);
      }

      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend',  onEnd);
    },{passive:true});
  });
}

function getRowAtY(list, y){
  var rows = list.querySelectorAll('.track-row');
  for(var i=0; i<rows.length; i++){
    var r = rows[i].getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) return rows[i];
  }
  return null;
}

// ── vibe input ────────────────────────────────────────────────────────────
$('vibe-input').addEventListener('keydown',async function(e){
  if(e.key!=='Enter') return;
  var v=$('vibe-input').value.trim();
  if(!v) return;
  pill('seeding: '+v+'...');
  $('vibe-input').blur();
  $('vibe-input').value='';
  await api('queue/seed','POST',{vibe:v});
  document.querySelector('[data-view="player"]').click();
  poll();
});

// ── search ────────────────────────────────────────────────────────────────
$('s-input').addEventListener('input',function(){
  clearTimeout(searchT);
  var q=$('s-input').value.trim();
  if(!q){
    $('s-list').innerHTML='<div class="hint"><div class="hint-ico">\uD83C\uDFB8</div><div>search youtube music</div></div>';
    return;
  }
  $('s-list').innerHTML='<div class="hint"><div class="hint-ico">\u23F3</div><div>searching...</div></div>';
  searchT=setTimeout(function(){doSearch(q);},650);
});

async function doSearch(q){
  var d=await api('search?q='+encodeURIComponent(q));
  if(!d||!d.results||!d.results.length){
    $('s-list').innerHTML='<div class="hint"><div class="hint-ico">\uD83E\uDD14</div><div>nothing found</div></div>';
    return;
  }
  $('s-list').innerHTML=d.results.map(function(t){
    var thumb=t.thumbnail
      ?'<img class="row-thumb" src="'+esc(t.thumbnail)+'" alt="" loading="lazy">'
      :'<div class="row-thumb-ph">\uD83C\uDFB5</div>';
    return '<div class="track-row" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+'" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">'+
      thumb+
      '<div class="row-meta"><div class="row-title">'+esc(t.title)+'</div>'+
      '<div class="row-artist">'+esc(t.artist)+'</div></div>'+
      '<div class="row-actions">'+
      '<button class="row-btn play" data-id="'+esc(t.video_id)+'" data-title="'+esc(t.title)+
        '" data-artist="'+esc(t.artist)+'" data-thumb="'+esc(t.thumbnail||'')+'">&#x25B6;</button>'+
      '</div></div>';
  }).join('');

  $('s-list').querySelectorAll('.row-btn.play').forEach(function(btn){
    btn.addEventListener('click',async function(e){
      e.stopPropagation();
      pill('loading...');
      await api('play','POST',{video_id:btn.dataset.id,title:btn.dataset.title,
        artist:btn.dataset.artist,thumbnail:btn.dataset.thumb});
      document.querySelector('[data-view="player"]').click();
      poll();
    });
  });
}

// ── helpers ───────────────────────────────────────────────────────────────
function fmt(s){
  if(!s||s<0) return '0:00';
  var m=Math.floor(s/60),sec=String(Math.floor(s%60)).padStart(2,'0');
  return m+':'+sec;
}
function esc(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pill(msg){
  var p=$('pill');
  p.textContent=msg; p.classList.add('show');
  clearTimeout(pillT);
  pillT=setTimeout(function(){p.classList.remove('show');},2000);
}

// wake lock
async function wl(){try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch(e){}}
wl();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') wl();});

// start
setInterval(poll,1500);
poll();
